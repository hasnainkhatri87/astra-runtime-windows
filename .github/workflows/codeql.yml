name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: c-cpp
          build-mode: none
          config: |
            paths:
              - include
              - src
              - tests

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:c-cpp"
