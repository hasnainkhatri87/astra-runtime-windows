name: Windows portable build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject tracked application packages
        shell: pwsh
        run: |
          $forbidden = @(
            git ls-files |
              Where-Object { $_ -match '(?i)\.(apk|apkm|apks|aab|xapk)$' }
          )
          if ($forbidden.Count -ne 0) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked package: $_" }
            throw "User-provided application packages must remain local."
          }

      - name: Configure
        shell: pwsh
        run: cmake --preset win-x64-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset win-x64-release --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --preset win-x64-release --output-on-failure

      - name: Install portable layout
        shell: pwsh
        run: |
          cmake --install out/build/win-x64-release `
            --config Release `
            --prefix out/stage/AstraRuntime
          Copy-Item policies out/stage/AstraRuntime/policies -Recurse
          Set-Content out/stage/AstraRuntime/BUILD_COMMIT.txt '${{ github.sha }}' -NoNewline

      - name: Confirm artifact contains no application packages
        shell: pwsh
        run: |
          $forbidden = @(
            Get-ChildItem out/stage/AstraRuntime -Recurse -File |
              Where-Object { $_.Extension -match '(?i)^\.(apk|apkm|apks|aab|xapk)$' }
          )
          if ($forbidden.Count -ne 0) {
            throw "Portable artifact unexpectedly contains an application package."
          }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive `
            -Path out/stage/AstraRuntime/* `
            -DestinationPath out/AstraRuntime-win-x64.zip `
            -CompressionLevel Optimal
          $hash = (Get-FileHash out/AstraRuntime-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AstraRuntime-win-x64.zip" |
            Set-Content out/AstraRuntime-win-x64.zip.sha256 -Encoding ascii

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: AstraRuntime-win-x64-${{ github.run_number }}
          path: |
            out/AstraRuntime-win-x64.zip
            out/AstraRuntime-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
