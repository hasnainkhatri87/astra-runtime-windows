name: Feature request
description: Propose a scoped compatibility or maintenance improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user or maintainer problem without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include compatibility, licensing, security, and testing considerations.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What reproducible test would show that this is complete?
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This request does not require bundling proprietary APKs/GMS or bypassing integrity, authentication, fraud, or payment controls.
          required: true
