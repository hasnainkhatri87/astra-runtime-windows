name: Bug report
description: Report a reproducible Astra defect
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach proprietary Android packages, credentials, tokens, or personal data. Report security issues privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Astra version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build number
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or redistributable fixtures where possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
  - type: checkboxes
    id: authorization
    attributes:
      label: Safety confirmation
      options:
        - label: I own or am authorized to test every package, account, and system involved.
          required: true
        - label: I removed credentials, tokens, proprietary packages, and personal data.
          required: true
